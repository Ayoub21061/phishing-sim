# Déploiement sur Render — service web gratuit
# Push ce dossier sur un repo GitHub, puis dans Render : New > Blueprint, pointe sur ce repo.
services:
  - type: web
    name: quishing-sim-ecam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
